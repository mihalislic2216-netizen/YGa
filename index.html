<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>2048: Эволюция и Рекорды</title>
    <script>
    (function() {
        var s = document.createElement('script');
        // На серверах Яндекса используем относительный путь /sdk.js
        // На других хостах — абсолютный
        s.src = (location.hostname.indexOf('yandex') !== -1 || location.hostname === 'localhost')
            ? '/sdk.js'
            : 'https://yandex.ru/games/sdk/v2';
        s.onerror = function() {
            // SDK не загрузился — запустим игру без него
            window.__sdkFailed = true;
        };
        document.head.appendChild(s);
    })();
    </script>
    <style>
        :root {
            --bg: #bbada0;
            --empty: #cdc1b4;
            --text: #776e65;
            --accent: #f65e3b;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            outline: none;
            margin: 0; padding: 0;
        }
        html {
            width: 100%; height: 100%;
            height: -webkit-fill-available;
        }
        body {
            width: 100%; height: 100%;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            background: #faf8ef;
            font-family: "Clear Sans", Arial, sans-serif;
            touch-action: none;
            overflow: hidden;
            /* Центрируем враппер */
            display: flex;
            align-items: center;
            justify-content: center;
            padding:
                env(safe-area-inset-top, 0px)
                env(safe-area-inset-right, 0px)
                env(safe-area-inset-bottom, 0px)
                env(safe-area-inset-left, 0px);
        }

        /*
         * #wrapper — единственный элемент внутри body.
         * Его размер полностью задаётся через JS.
         * Все дочерние элементы растянуты на его ширину.
         */
        #wrapper {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0;
        }

        /* ───── ХЕДЕР ───── */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .title-main {
            display: flex;
            align-items: baseline;
        }
        .title-num   { font-weight: 900; color: var(--text); line-height: 1; }
        .title-colon { font-weight: 900; color: var(--accent); line-height: 1; }
        .title-sub   { font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #8f857b; white-space: nowrap; }

        .score-container { display: flex; }
        .score-box {
            background: var(--bg);
            border-radius: 4px;
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .score-label { text-transform: uppercase; display: block; opacity: 0.85; font-weight: 700; }
        .score-val   { font-weight: bold; display: block; }
        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 6px;
        }
        .icon-btn {
            border: none;
            border-radius: 5px;
            background: #8f7a66;
            color: #fff;
            font-family: inherit;
            font-weight: 800;
            cursor: pointer;
            line-height: 1;
        }

        /* ───── ИГРОВОЕ ПОЛЕ ───── */
        #game-container {
            background: var(--bg);
            border-radius: 6px;
            padding: 0; /* padding задаётся через JS */
            flex-shrink: 0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 100%;
            height: 100%;
        }
        .cell {
            background: var(--empty);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--text);
            transition: transform .12s ease, box-shadow .12s ease;
        }
        .cell.new-tile {
            animation: tile-pop .18s ease-out;
        }
        .cell.merged-tile {
            animation: tile-merge .2s ease-out;
            box-shadow: 0 0 18px rgba(246,94,59,.35);
        }
        .tile-2   { background: #eee4da; }
        .tile-4   { background: #ede0c8; }
        .tile-8   { background: #f2b179; color: #fff; }
        .tile-16  { background: #f59563; color: #fff; }
        .tile-32  { background: #f67c5f; color: #fff; }
        .tile-64  { background: #f65e3b; color: #fff; }
        .tile-128 { background: #edcf72; color: #fff; }
        .tile-256 { background: #edcc61; color: #fff; }
        .tile-512 { background: #edc850; color: #fff; }
        .tile-1024{ background: #edc53f; color: #fff; }
        .tile-2048{ background: #edc22e; color: #fff; box-shadow: 0 0 20px rgba(237,194,46,.6); }
        @keyframes tile-pop {
            from { transform: scale(.72); opacity: .35; }
            to   { transform: scale(1); opacity: 1; }
        }
        @keyframes tile-merge {
            0%   { transform: scale(1); }
            55%  { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        /* ───── КНОПКИ ───── */
        .game-btn {
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
        }
        #reward-btn  { background: #2ecc71; visibility: hidden; }
        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        #shop-btn { background: #8f7a66; }
        #undo-btn { background: #3d8bfd; }
        #auth-banner {
            display: none;
            background: #f0e9e0;
            border-radius: 6px;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        #auth-banner span { color: #776e65; line-height: 1.3; }
        #auth-btn {
            background: var(--accent);
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ───── МОДАЛКА ───── */
        #modal,
        #shop-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding:
                max(14px, env(safe-area-inset-top, 0px))
                max(14px, env(safe-area-inset-right, 0px))
                max(14px, env(safe-area-inset-bottom, 0px))
                max(14px, env(safe-area-inset-left, 0px));
        }
        .modal-content {
            background: #fffdf8;
            padding: 22px;
            border-radius: 10px;
            width: min(420px, 100%);
            max-height: calc(100dvh - 28px);
            overflow: auto;
            box-shadow: 0 18px 44px rgba(64,49,38,.28);
        }
        .modal-content h2 { color: var(--text); margin-bottom: 8px; }
        .modal-content p  { color: var(--text); margin-bottom: 12px; }
        .controls { display: flex; flex-direction: column; gap: 8px; }
        .controls button {
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }
        .shop-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
        .shop-list button {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            text-align: left;
            padding: 12px;
            background: linear-gradient(180deg, #fff7e8, #f4eadc);
            border: 2px solid #e2d2c0;
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.65), 0 4px 0 #d2bfae;
            transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
        }
        .shop-list button:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.65), 0 2px 0 #d2bfae;
        }
        .shop-list button:disabled {
            opacity: .62;
            cursor: default;
            box-shadow: none;
        }
        .shop-main {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 4px 10px;
            align-items: center;
            min-width: 0;
        }
        .shop-icon {
            grid-row: span 2;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            background: #8f7a66;
            color: #fff;
            font-size: 19px;
            line-height: 1;
        }
        .shop-name {
            font-weight: 900;
            line-height: 1.1;
        }
        .shop-desc {
            font-size: 12px;
            line-height: 1.2;
            color: #8f857b;
            overflow-wrap: anywhere;
        }
        .shop-price {
            background: var(--accent);
            color: #fff;
            border-radius: 999px;
            padding: 7px 10px;
            font-weight: 900;
            opacity: 1;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .shop-owned {
            margin-top: 10px;
            color: var(--text);
            font-weight: 700;
            line-height: 1.35;
        }
        @media (max-width: 380px) {
            .modal-content { padding: 16px; }
            .shop-list button {
                align-items: stretch;
                flex-direction: column;
            }
            .shop-price {
                align-self: flex-start;
            }
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="wrapper">
    <header id="header">

                <span class="title-num">2048</span><span class="title-colon">:</span>

                <button class="icon-btn" id="shop-btn" aria-label="Магазин">🛒</button>

        <div class="controls">
            <button id="btn-extra"   style="display:none; background:#2ecc71;">Второй шанс 📺</button>

</div>

<script>
'use strict';

/* ─── STATE ─── */
let sdk, player, lang = 'ru';
let payments = null;
let catalog = {};
let board = Array(16).fill(0);
let previousBoard = null;
let newTileIndex = -1;
let mergedTileIndexes = [];
let score = 0, highScore = 0;
let isRewardUsed = false, isSecondChanceUsed = false;
let isMuted = false;
let audioCtx = null;
let purchases = {
    noAdsUntil: 0,
    secondChances: 0,
    undos: 0
};
const PRODUCTS = {
    noAds: 'no_ads_month',
    chances: 'second_chance_3',
    undos: 'undo_5'
};
const LEGACY_NO_ADS_PRODUCT = 'no_ads';
const NO_ADS_DURATION_MS = 30 * 24 * 60 * 60 * 1000;
const CONSUMABLE_PRODUCTS = [PRODUCTS.noAds, LEGACY_NO_ADS_PRODUCT, PRODUCTS.chances, PRODUCTS.undos];

/* ─── I18N ─── */
const i18n = {
    ru: { score:'Счет', best:'Рекорд', over:'Игра окончена', restart:'Заново',
          second:'Второй шанс 📺', x2:'Удвоить счет 📺', sub:'Эволюция и Рекорды',
          authText:'Войдите чтобы сохранить рекорд в таблицу', authBtn:'Войти 🏆',
          authModal:'Войти и сохранить 🏆', shop:'Магазин', close:'Закрыть',
          shopBody:'Бонусы сохраняются в профиле после входа.', noAds:'Без рекламы на 30 дней',
          chances:'3 вторых шанса', undos:'5 отмен хода', paidSecond:'Второй шанс',
          noAdsDesc:'Отключает fullscreen-рекламу и продлевает срок', chancesDesc:'Продолжить после проигрыша без рекламы',
          undosDesc:'Вернуть предыдущий ход',
          buyChances:'Купить 3 шанса', undo:'Отмена', owned:'Без рекламы: {ads}. Шансы: {chances}. Отмены: {undos}.',
          unavailable:'Недоступно', loading:'Загрузка', activeUntil:'до {date}', inactive:'нет', yes:'да', no:'нет', soundOn:'Выключить звук', soundOff:'Включить звук' },
    en: { score:'Score', best:'Best', over:'Game Over', restart:'Restart',
          second:'Second Chance 📺', x2:'Удвоить счет 📺', sub:'Evolution & Records',
          authText:'Sign in to save your score to the leaderboard', authBtn:'Sign in 🏆',
          authModal:'Sign in & Save 🏆', shop:'Shop', close:'Close',
          shopBody:'Bonuses are saved to your profile after sign-in.', noAds:'No ads for 30 days',
          chances:'3 second chances', undos:'5 undos', paidSecond:'Second chance',
          noAdsDesc:'Disables fullscreen ads and extends the term', chancesDesc:'Continue after game over without ads',
          undosDesc:'Return to the previous move',
          buyChances:'Buy 3 chances', undo:'Undo', owned:'No ads: {ads}. Chances: {chances}. Undos: {undos}.',
          unavailable:'Unavailable', loading:'Loading', activeUntil:'until {date}', inactive:'no', yes:'yes', no:'no', soundOn:'Mute sound', soundOff:'Enable sound' }
};

/* ─── RESIZE ─── */
function resize() {
    // Используем visualViewport — самый точный источник размера на мобильных
    // при повороте, появлении клавиатуры и т.д.
    const vvp = window.visualViewport;
    const vw  = vvp ? vvp.width  : document.documentElement.clientWidth;
    const vh  = vvp ? vvp.height : document.documentElement.clientHeight;

    const isLandscape  = vw > vh;
    const headerRatio  = isLandscape ? 0.22 : 0.26;
    const gapRatio     = isLandscape ? 0.02  : 0.025;
    const sidePad      = (vw < 600) ? Math.round(vw * 0.05) : 0;
    const fieldW       = vw - sidePad * 2;
    // Всегда резервируем место под ряд бонусов (10% высоты + зазоры)
    // чтобы поле не прыгало когда кнопка появляется
    const btnRatio     = 0.10;
    const reservedH    = vh * (headerRatio + btnRatio + gapRatio * 4);
    const fieldH       = vh - reservedH;
    const S            = Math.floor(Math.min(fieldW, fieldH));

    const wrapper = document.getElementById('wrapper');
    const field   = document.getElementById('game-container');
    const header  = document.getElementById('header');

    // Враппер — ширина = S, это центрирует всё через body flexbox
    wrapper.style.width = S + 'px';
    wrapper.style.gap   = Math.round(S * gapRatio) + 'px';

    // Поле
    const pad  = Math.max(6, Math.round(S * 0.02));
    const gap  = Math.max(4, Math.round(S * 0.018));
    field.style.width   = S + 'px';
    field.style.height  = S + 'px';
    field.style.padding = pad + 'px';
    field.style.borderRadius = Math.round(S * 0.015) + 'px';
    document.querySelector('.grid').style.gap = gap + 'px';

    // Хедер выше счетчиков: в левом блоке есть название, подзаголовок и две кнопки.
    const titleFs = Math.round(S * 0.105);
    const subFs = Math.max(8, Math.round(titleFs * 0.27));
    const iconSize = Math.max(24, Math.round(S * 0.075));
    const hH = Math.max(
        Math.round(S * headerRatio),
        titleFs + subFs + iconSize + Math.round(S * 0.02) + 8
    );
    header.style.height = hH + 'px';

    // Шрифт заголовка
    document.querySelector('.title-num').style.fontSize   = titleFs + 'px';
    document.querySelector('.title-colon').style.fontSize = titleFs + 'px';
    document.querySelector('.title-sub').style.fontSize   = subFs + 'px';

    // Score-боксы
    const sc = document.getElementById('score-container');
    const boxGap = Math.round(S * 0.015);
    const boxW   = Math.round(S * 0.185);
    const scoreH = Math.round(S * (isLandscape ? 0.16 : 0.14));
    sc.style.gap = boxGap + 'px';
    ['box-score','box-best'].forEach(id => {
        const el = document.getElementById(id);
        el.style.minWidth     = boxW + 'px';
        el.style.width        = 'auto';
        el.style.height       = scoreH + 'px';
        el.style.borderRadius = Math.round(S * 0.012) + 'px';
        el.style.padding      = '2px ' + Math.round(S * 0.02) + 'px';
    });
    const valFs = Math.round(S * 0.05);
    const lblFs = Math.round(S * 0.028);
    document.querySelectorAll('.score-val').forEach(el => el.style.fontSize = valFs + 'px');
    document.querySelectorAll('.score-label').forEach(el => el.style.fontSize = lblFs + 'px');

    // Кнопки под полем
    const btnH   = Math.round(S * 0.1);
    const btnFs  = Math.round(S * 0.04);
    const btnPad = Math.round(S * 0.025);
    ['reward-btn','undo-btn'].forEach(id => {
        const el = document.getElementById(id);
        el.style.height       = btnH + 'px';
        el.style.fontSize     = btnFs + 'px';
        el.style.borderRadius = Math.round(S * 0.012) + 'px';
        // В альбомной — добавляем отступ снизу чтобы кнопка не липла к краю
        el.style.marginBottom = isLandscape ? Math.round(vh * 0.04) + 'px' : '0px';
    });
    document.querySelector('.action-row').style.gap = boxGap + 'px';
    document.querySelectorAll('.icon-btn').forEach(el => {
        el.style.width = iconSize + 'px';
        el.style.height = iconSize + 'px';
        el.style.fontSize = Math.round(iconSize * 0.55) + 'px';
    });
    const ab = document.getElementById('auth-banner');
    ab.style.padding      = btnPad + 'px';
    ab.style.borderRadius = Math.round(S * 0.012) + 'px';
    ab.style.gap          = boxGap + 'px';
    document.getElementById('auth-text').style.fontSize = Math.round(S * 0.032) + 'px';
    const authBtn = document.getElementById('auth-btn');
    authBtn.style.padding  = btnPad * 0.6 + 'px ' + btnPad + 'px';
    authBtn.style.fontSize = Math.round(S * 0.035) + 'px';

    // Шрифт плиток пропорционально ячейке
    const cellS  = (S - pad * 2 - gap * 3) / 4;
    const cellFs = Math.round(cellS * 0.45);
    document.querySelectorAll('.cell').forEach(el => {
        el.style.fontSize     = cellFs + 'px';
        el.style.borderRadius = Math.round(cellS * 0.08) + 'px';
    });
}

// resize — слушаем visualViewport если есть (точнее на iOS/Android)
if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
    window.visualViewport.addEventListener('scroll', resize);
} else {
    window.addEventListener('resize', resize);
}
// orientationchange — ждём несколько кадров пока браузер пересчитает viewport
window.addEventListener('orientationchange', () => {
    // Пробуем 3 раза с нарастающей задержкой
    setTimeout(resize, 100);
    setTimeout(resize, 300);
    setTimeout(resize, 600);
});

/* ─── SDK ─── */
function gameplayStart() {
    if (sdk) sdk.features.GameplayAPI?.start();
}
function gameplayStop() {
    if (sdk) sdk.features.GameplayAPI?.stop();
}

function initSoundState() {
    try { isMuted = localStorage.getItem('2048_muted') === '1'; } catch(e) { isMuted = false; }
    updateSoundUI();
}

function updateSoundUI() {
    const btn = document.getElementById('sound-btn');
    if (!btn) return;
    btn.textContent = isMuted ? '🔇' : '🔊';
    btn.setAttribute('aria-label', isMuted ? i18n[lang].soundOff : i18n[lang].soundOn);
}

function toggleSound() {
    isMuted = !isMuted;
    try { localStorage.setItem('2048_muted', isMuted ? '1' : '0'); } catch(e){}
    updateSoundUI();
    if (!isMuted) playTone('move');
}

function playTone(type) {
    if (isMuted) return;
    try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const tones = {
            move: [220, .035, .025],
            merge: [330, .055, .04],
            buy: [520, .08, .05],
            fail: [130, .08, .035]
        };
        const [freq, duration, volume] = tones[type] || tones.move;
        osc.frequency.value = freq;
        osc.type = 'triangle';
        gain.gain.value = volume;
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
}

function loadHighScore() {
    try { return parseInt(localStorage.getItem('2048_hs')) || 0; } catch(e) { return 0; }
}

function loadLocalPurchases() {
    try {
        const raw = localStorage.getItem('2048_purchases');
        return normalizePurchases(raw ? JSON.parse(raw) : {});
    } catch(e) {
        return normalizePurchases({});
    }
}

function normalizePurchases(data) {
    const legacyNoAdsUntil = data.noAds ? Date.now() + NO_ADS_DURATION_MS : 0;
    return {
        noAdsUntil: Math.max(parseInt(data.noAdsUntil) || 0, legacyNoAdsUntil),
        secondChances: Math.max(0, parseInt(data.secondChances) || 0),
        undos: Math.max(0, parseInt(data.undos) || 0)
    };
}

function mergePurchases(a, b) {
    return {
        noAdsUntil: Math.max(parseInt(a.noAdsUntil) || 0, parseInt(b.noAdsUntil) || 0),
        secondChances: Math.max(a.secondChances || 0, b.secondChances || 0),
        undos: Math.max(a.undos || 0, b.undos || 0)
    };
}

function isNoAdsActive() {
    return (parseInt(purchases.noAdsUntil) || 0) > Date.now();
}

function getNoAdsStatusText() {
    const t = i18n[lang];
    if (!isNoAdsActive()) return t.inactive;
    const date = new Date(purchases.noAdsUntil).toLocaleDateString(lang === 'ru' ? 'ru-RU' : 'en-US', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
    });
    return t.activeUntil.replace('{date}', date);
}

async function savePurchaseState() {
    try { localStorage.setItem('2048_purchases', JSON.stringify(purchases)); } catch(e){}
    updateBonusUI();
    if (isAuthorized() && player.setData) {
        try { await player.setData({ purchases }, true); } catch(e){}
    }
}

async function syncPurchases() {
    purchases = mergePurchases(purchases, loadLocalPurchases());
    if (isAuthorized() && player.getData) {
        try {
            const data = await player.getData(['purchases']);
            if (data && data.purchases) purchases = mergePurchases(purchases, normalizePurchases(data.purchases));
        } catch(e){}
    }
    if (payments) {
        try {
            const products = await payments.getCatalog();
            catalog = products.reduce((acc, item) => {
                acc[item.id] = item;
                return acc;
            }, {});
        } catch(e) {
            catalog = {};
        }
        try {
            const pending = await payments.getPurchases();
            for (const purchase of pending) {
                const productId = getPurchaseProductId(purchase);
                if (productId) await applyPurchase(productId, false);
                if (purchase.purchaseToken && CONSUMABLE_PRODUCTS.indexOf(productId) !== -1) {
                    await savePurchaseState();
                    await payments.consumePurchase(purchase.purchaseToken);
                }
            }
        } catch(e){}
    }
    await savePurchaseState();
}

function getPurchaseProductId(purchase) {
    return purchase.productID || purchase.productId || purchase.product?.id || purchase.id;
}

async function applyPurchase(productId, save = true) {
    if (productId === PRODUCTS.noAds || productId === LEGACY_NO_ADS_PRODUCT) {
        purchases.noAdsUntil = Math.max(Date.now(), parseInt(purchases.noAdsUntil) || 0) + NO_ADS_DURATION_MS;
    }
    if (productId === PRODUCTS.chances) purchases.secondChances += 3;
    if (productId === PRODUCTS.undos) purchases.undos += 5;
    playTone('buy');
    updateBonusUI();
    if (save) await savePurchaseState();
}

async function buyProduct(productId) {
    if (!payments) {
        updateStoreUI(i18n[lang].unavailable);
        return;
    }
    gameplayStop();
    try {
        const purchase = await payments.purchase({ id: productId });
        await applyPurchase(productId);
        const token = purchase && purchase.purchaseToken;
        if (token && CONSUMABLE_PRODUCTS.indexOf(productId) !== -1) await payments.consumePurchase(token);
    } catch(e) {
        // Игрок отменил покупку или платежи временно недоступны.
    } finally {
        gameplayStart();
    }
}

function startWithoutSDK() {
    highScore = loadHighScore();
    purchases = mergePurchases(purchases, loadLocalPurchases());
    updateBonusUI();
    initGame();
    if (highScore > 0) document.getElementById('auth-banner').style.display = 'flex';
}



/* ─── LANG ─── */

    const t = i18n[lang];
    document.getElementById('txt-score').textContent  = t.score;
    document.getElementById('txt-best').textContent   = t.best;
    document.getElementById('btn-restart').textContent = t.restart;
    document.getElementById('btn-extra').textContent   = t.second;
    document.getElementById('reward-btn').textContent  = t.x2;
    document.getElementById('title-sub').textContent   = t.sub;
    document.getElementById('auth-text').textContent      = t.authText;
    document.getElementById('auth-btn').textContent       = t.authBtn;
    document.getElementById('btn-auth-modal').textContent = t.authModal;
    document.getElementById('shop-title').textContent     = t.shop;
    document.getElementById('shop-body').textContent      = t.shopBody;
    document.getElementById('txt-no-ads').textContent     = t.noAds;
    document.getElementById('txt-chances').textContent    = t.chances;
    document.getElementById('txt-undos').textContent      = t.undos;
    document.getElementById('desc-no-ads').textContent    = t.noAdsDesc;

    document.getElementById('desc-undos').textContent     = t.undosDesc;
    document.getElementById('btn-buy-chances').textContent = t.buyChances;

function getProductPrice(productId) {
    const product = catalog[productId];
    return product ? (product.price || product.priceValue || product.priceCurrencyCode || product.title || '') : '';
}

function updateStoreUI(message) {
    const t = i18n[lang];
    const fallback = payments ? t.loading : t.unavailable;
    const priceNoAds = getProductPrice(PRODUCTS.noAds) || fallback;
    const priceChances = getProductPrice(PRODUCTS.chances) || fallback;
    const priceUndos = getProductPrice(PRODUCTS.undos) || fallback;
    document.getElementById('price-no-ads').textContent = priceNoAds;
    document.getElementById('price-chances').textContent = priceChances;
    document.getElementById('price-undos').textContent = priceUndos;
    document.getElementById('buy-no-ads').disabled = !payments;
    document.getElementById('buy-chances').disabled = !payments;
    document.getElementById('buy-undos').disabled = !payments;
    document.getElementById('shop-owned').textContent = message || t.owned
        .replace('{ads}', getNoAdsStatusText())
        .replace('{chances}', purchases.secondChances)
        .replace('{undos}', purchases.undos);
}

function updateBonusUI() {
    const t = i18n[lang];
    document.getElementById('undo-btn').textContent = t.undo + ': ' + purchases.undos;
    document.getElementById('btn-paid-extra').textContent = t.paidSecond + ': ' + purchases.secondChances;
    document.getElementById('btn-paid-extra').style.display =
        (!isSecondChanceUsed && purchases.secondChances > 0) ? 'block' : 'none';
    updateStoreUI();
}

/* ─── GAME ─── */
function initGame() {
    board = Array(16).fill(0);
    previousBoard = null;
    newTileIndex = -1;
    mergedTileIndexes = [];
    score = 0; isRewardUsed = false; isSecondChanceUsed = false;
    document.getElementById('modal').style.display         = 'none';
    document.getElementById('reward-btn').style.visibility  = 'hidden';
    if (isAuthorized()) {
        hideAuthUI();
    } else {
        document.getElementById('btn-auth-modal').style.display = 'none';
        // Баннер только если есть рекорд для сохранения
        document.getElementById('auth-banner').style.display = highScore > 0 ? 'flex' : 'none';
    }
    resize();
    addTile(); addTile(); render();
    gameplayStart(); // геймплей начался
}

function addTile() {
    const empty = board.map((v,i) => v===0?i:null).filter(v=>v!==null);
    if (empty.length) {
        newTileIndex = empty[Math.floor(Math.random()*empty.length)];
        board[newTileIndex] = Math.random()>.1 ? 2 : 4;
    }
}

function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    // Пересчитываем размер ячеек из текущего поля
    const field  = document.getElementById('game-container');
    const S      = field.offsetWidth || 300;
    const pad    = Math.max(6, Math.round(S * 0.02));
    const gap    = Math.max(4, Math.round(S * 0.018));
    const cellS  = (S - pad * 2 - gap * 3) / 4;
    const cellFs = Math.round(cellS * 0.45);

    board.forEach((val, idx) => {
        const cell = document.createElement('div');
        cell.className   = 'cell' + (val ? ' tile-'+val : '');
        if (idx === newTileIndex) cell.className += ' new-tile';
        if (mergedTileIndexes.indexOf(idx) !== -1) cell.className += ' merged-tile';
        cell.textContent = val || '';
        cell.style.fontSize     = cellFs + 'px';
        cell.style.borderRadius = Math.round(cellS * 0.08) + 'px';
        grid.appendChild(cell);
    });
    document.getElementById('score').textContent      = score;
    document.getElementById('high-score').textContent = highScore;
    if (score >= 500 && !isRewardUsed) document.getElementById('reward-btn').style.visibility = 'visible';
    if (score > 0 && board.includes(2048)) saveStats();
    updateBonusUI();
    mergedTileIndexes = [];
}

function move(dir) {
    let changed = false;
    const beforeMove = board.slice();
    const beforeScore = score;
    mergedTileIndexes = [];
    newTileIndex = -1;
    const N = 4;
    for (let i = 0; i < N; i++) {
        let row = [];
        for (let j = 0; j < N; j++) {
            const idx = (dir==='UP'||dir==='DOWN') ? j*N+i : i*N+j;
            row.push(board[idx]);
        }
        if (dir==='RIGHT'||dir==='DOWN') row.reverse();
        let r = row.filter(v=>v);
        for (let j = 0; j < r.length-1; j++) {
            if (r[j]===r[j+1]) { r[j]*=2; score+=r[j]; r.splice(j+1,1); changed=true; }
        }
        while (r.length<N) r.push(0);
        if (dir==='RIGHT'||dir==='DOWN') r.reverse();
        for (let j = 0; j < N; j++) {
            const idx = (dir==='UP'||dir==='DOWN') ? j*N+i : i*N+j;
            if (board[idx]!==r[j]) changed=true;
            if (r[j] && board[idx] !== r[j] && row.filter(v => v === r[j] / 2).length >= 2) mergedTileIndexes.push(idx);
            board[idx]=r[j];
        }
    }
    if (changed) {
        previousBoard = { board: beforeMove, score: beforeScore };
        addTile();
        render();
        playTone(score > beforeScore ? 'merge' : 'move');
        checkEnd();
    } else {
        playTone('fail');
    }
}

function checkEnd() {
    if (board.includes(0)) return;
    for (let i=0;i<16;i++) {
        if (i%4!==3 && board[i]===board[i+1]) return;
        if (i<12   && board[i]===board[i+4]) return;
    }
    gameplayStop();
    saveStats();
    showModal(i18n[lang].over, !isSecondChanceUsed);
}

function showModal(title, extra) {
    document.getElementById('modal').style.display          = 'flex';
    document.getElementById('modal-title').textContent      = title;
    document.getElementById('modal-body').textContent       = i18n[lang].score + ': ' + score;
    document.getElementById('btn-extra').style.display      = extra ? 'block' : 'none';
    document.getElementById('btn-paid-extra').style.display = (extra && purchases.secondChances > 0) ? 'block' : 'none';
    document.getElementById('btn-buy-chances').style.display = (extra && purchases.secondChances <= 0 && payments) ? 'block' : 'none';
    document.getElementById('btn-auth-modal').style.display = (!isAuthorized() && highScore > 0) ? 'block' : 'none';
    updateBonusUI();
}

async function useSecondChance(isPaid) {
    if (isPaid) {
        if (purchases.secondChances <= 0) return;
        purchases.secondChances -= 1;
        await savePurchaseState();
    }
    isSecondChanceUsed = true;
    const occ = board.map((v,i)=>v?i:null).filter(v=>v!==null);
    occ.sort(()=>Math.random()-.5).slice(0,4).forEach(i=>board[i]=0);
    document.getElementById('modal').style.display = 'none';
    render();
    playTone('buy');
    gameplayStart();
}

/* ─── BUTTONS ─── */
document.getElementById('btn-restart').onclick = () => {
    saveStats();
    gameplayStop();
    if (isNoAdsActive()) initGame();
    else if (sdk) sdk.adv.showFullscreenAdv({ callbacks:{
        onClose: (wasShown) => initGame(),
        onError: () => initGame()
    }});
    else initGame();
};

document.getElementById('btn-extra').onclick = () => {
    if (!sdk) { return; }
    gameplayStop();
    sdk.adv.showRewardedVideo({ callbacks:{
        onRewarded() {
            useSecondChance(false);
        },
        onClose(wasShown) { gameplayStart(); }
    }});
};

document.getElementById('btn-paid-extra').onclick = () => useSecondChance(true);
document.getElementById('btn-buy-chances').onclick = () => buyProduct(PRODUCTS.chances);

document.getElementById('reward-btn').onclick = () => {
    if (!sdk) return;
    gameplayStop();
    sdk.adv.showRewardedVideo({ callbacks:{
        onRewarded() {
            score *= 2; isRewardUsed = true;
            document.getElementById('reward-btn').style.visibility = 'hidden';
            render();
            playTone('buy');
            gameplayStart();
        },
        onClose(wasShown) { gameplayStart(); }
    }});
};

document.getElementById('undo-btn').onclick = async () => {
    if (!previousBoard || purchases.undos <= 0) {
        playTone('fail');
        return;
    }
    purchases.undos -= 1;
    board = previousBoard.board.slice();
    score = previousBoard.score;
    previousBoard = null;
    newTileIndex = -1;
    mergedTileIndexes = [];
    await savePurchaseState();
    render();
    playTone('buy');
};

document.getElementById('shop-btn').onclick = () => {
    updateStoreUI();
    document.getElementById('shop-modal').style.display = 'flex';
    gameplayStop();
};

document.getElementById('shop-close').onclick = () => {
    document.getElementById('shop-modal').style.display = 'none';
    gameplayStart();
};

document.getElementById('buy-no-ads').onclick = () => buyProduct(PRODUCTS.noAds);
document.getElementById('buy-chances').onclick = () => buyProduct(PRODUCTS.chances);
document.getElementById('buy-undos').onclick = () => buyProduct(PRODUCTS.undos);
document.getElementById('sound-btn').onclick = toggleSound;

document.getElementById('btn-auth-modal').onclick = () => {
    if (!sdk) return;
    document.getElementById('modal').style.display = 'none';
    sdk.auth.openAuthDialog()
        .then(() => sdk.getPlayer({ scopes: false }))
        .then(_p => {
            player = _p;
            syncPurchases();
            saveToCloud(); // сохраняем рекорд сразу после входа
        }).catch(() => {
            // Если отменил авторизацию — возвращаем модалку
            document.getElementById('modal').style.display = 'flex';
        });
};

document.getElementById('auth-btn').onclick = () => {
    if (!sdk) return;
    sdk.auth.openAuthDialog()
        .then(() => sdk.getPlayer({ scopes: false }))
        .then(_p => {
            player = _p;
            syncPurchases();
            saveToCloud(); // сохраняем рекорд сразу после входа
        }).catch(() => {});
};

/* ─── SAVE ─── */
function isAuthorized() { return player && player.isAuthorized(); }

function hideAuthUI() {
    document.getElementById('auth-banner').style.display    = 'none';
    document.getElementById('btn-auth-modal').style.display = 'none';
}

function showAuthUI() {
    document.getElementById('btn-auth-modal').style.display = 'block';
    // Баннер только если есть что сохранять
    if (highScore > 0) {
        document.getElementById('auth-banner').style.display = 'flex';
    }
}

function saveToCloud() {
    if (!isAuthorized()) return;
    player.setStats({ highScore });
    if (sdk) {
        sdk.isAvailableMethod('leaderboards.setScore').then(available => {
            if (available) sdk.leaderboards.setScore('TopPlayers', highScore).catch(() => {});
        }).catch(() => {});
    }
    hideAuthUI();
}

function saveStats() {
    if (score <= highScore) return;
    highScore = score;
    document.getElementById('high-score').textContent = highScore;
    try { localStorage.setItem('2048_hs', highScore); } catch(e){}
    if (isAuthorized()) {
        saveToCloud();
    } else {
        showAuthUI();
    }
}

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        gameplayStop();
        if (score > 0) saveStats();
    } else {
        // Возобновляем только если игра активна (модалка не открыта)
        const modalOpen = document.getElementById('modal').style.display === 'flex';
        if (!modalOpen) gameplayStart();
    }
});
window.addEventListener('beforeunload', () => { if (score > 0) saveStats(); });

/* ─── INPUT ─── */
const KEY = {
    ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT',
    KeyW:'UP', KeyS:'DOWN', KeyA:'LEFT', KeyD:'RIGHT'
};
function onKey(e) {
    if (KEY[e.code]) { e.preventDefault(); e.stopPropagation(); move(KEY[e.code]); }
}
document.addEventListener('keydown', onKey, true);
window.addEventListener('keydown', onKey, true);

let t0 = null;

function isInteractive(el) {
    while (el && el !== document.body) {
        const tag = el.tagName;
        if (tag === 'BUTTON' || tag === 'A' || tag === 'INPUT' || tag === 'SELECT') return true;
        if (el.id === 'modal' || el.id === 'auth-banner' || el.id === 'reward-btn') return true;
        el = el.parentElement;
    }
    return false;
}

window.addEventListener('touchstart', e => {
    if (isInteractive(e.target)) { t0 = null; return; }
    e.preventDefault();
    t0 = e.touches[0];
}, {passive:false});

window.addEventListener('touchend', e => {
    if (!t0) return;
    const dx = e.changedTouches[0].clientX - t0.clientX;
    const dy = e.changedTouches[0].clientY - t0.clientY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 30) {
        move(Math.abs(dx)>Math.abs(dy) ? (dx>0?'RIGHT':'LEFT') : (dy>0?'DOWN':'UP'));
    }
    t0 = null;
}, {passive:false});

/* ─── INIT ─── */
document.addEventListener('DOMContentLoaded', () => {
    initSoundState();
    purchases = mergePurchases(purchases, loadLocalPurchases());
    updateBonusUI();
    resize();
    // Если SDK уже загружен или не нужен — инициализируем сразу
    if (typeof YaGames !== 'undefined') {
        initSDK();
    } else if (window.__sdkFailed) {
        startWithoutSDK();
    } else {
        // Ждём загрузки SDK максимум 3 секунды
        var attempts = 0;
        var interval = setInterval(() => {
            attempts++;
            if (typeof YaGames !== 'undefined') {
                clearInterval(interval);
                initSDK();
            } else if (attempts > 30 || window.__sdkFailed) {
                clearInterval(interval);
                startWithoutSDK();
            }
        }, 100);
    }
});

async function initSDK() {
    try {
        const _sdk = await YaGames.init();
        sdk = _sdk;
        lang = sdk.environment.i18n.lang === 'ru' ? 'ru' : 'en';
        applyLang();
        sdk.features.LoadingAPI?.ready();
        try {
            payments = await sdk.getPayments();
        } catch(e) {
            payments = null;
        }
        sdk.getStorage().then(ss => {
            try { Object.defineProperty(window, 'localStorage', { get: () => ss }); } catch(e){}
        }).catch(() => {});
        const _player = await sdk.getPlayer({ scopes: false });
        player = _player;
        await syncPurchases();
        if (player.isAuthorized()) {
            const data = await player.getStats(['highScore']);
            const cloud = (data && data.highScore) ? parseInt(data.highScore) || 0 : 0;
            highScore = Math.max(cloud, loadHighScore());
        } else {
            highScore = loadHighScore();
        }
        initGame();
    } catch(e) {
        highScore = loadHighScore();
        purchases = mergePurchases(purchases, loadLocalPurchases());
        updateBonusUI();
        initGame();
        if (highScore > 0) document.getElementById('auth-banner').style.display = 'flex';
    }
}
